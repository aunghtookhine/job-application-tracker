#spring.application.name=job-application-tracker

spring:
  application:
    name: job-application-tracker
  config:
    import: file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/jobtracker
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
